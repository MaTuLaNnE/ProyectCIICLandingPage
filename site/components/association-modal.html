<div id="associationModal"
    onclick="if(event.target === this) closeAssociationModal()"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] px-4">

    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-fadeIn relative">

        <button type="button"
            onclick="closeAssociationModal()"
            class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 z-10">
            <i data-feather="x" class="w-5 h-5"></i>
        </button>

        <div class="bg-[#003366] text-white px-8 py-6">
            <h2 class="text-2xl font-bold">Associe-se à Câmara</h2>
            <p class="text-white/80 mt-1">
                Preencha os dados e nossa equipe entrará em contato.
            </p>
        </div>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4">
                    <p class="text-sm text-gray-500 mb-1">Taxa de inscrição</p>
                    <p class="text-2xl font-bold text-[#003366]">R$ 150,00</p>
                </div>

                <div class="bg-yellow-50 border border-yellow-100 rounded-xl p-4">
                    <p class="text-sm text-gray-500 mb-1">Cuota trimestral</p>
                    <p class="text-2xl font-bold text-[#003366]">R$ 120,00</p>
                </div>
            </div>

            <form id="associationForm" class="association-form space-y-4">
                <input type="hidden" name="subject" value="Associação à Câmara">

                <div>
                    <label for="associationName" class="block text-sm font-semibold text-gray-700 mb-2">
                        Nome completo
                    </label>
                    <input id="associationName" name="name" type="text" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Seu nome completo">
                </div>

                <div>
                    <label for="associationEmail" class="block text-sm font-semibold text-gray-700 mb-2">
                        E-mail
                    </label>
                    <input id="associationEmail" name="email" type="email" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="seuemail@exemplo.com">
                </div>

                <div>
                    <label for="associationPhone" class="block text-sm font-semibold text-gray-700 mb-2">
                        Telefone / WhatsApp
                    </label>
                    <input id="associationPhone" name="phone" type="text" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="+55 ...">
                </div>

                <div>
                    <label for="associationMessage" class="block text-sm font-semibold text-gray-700 mb-2">
                        Mensagem
                    </label>
                    <textarea id="associationMessage" name="message" rows="4"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                        placeholder="Quero me associar à Câmara."></textarea>
                </div>

                <div class="hidden text-sm rounded-lg px-4 py-3" data-form-status></div>

                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button type="submit"
                        class="bg-[#003366] hover:bg-[#00264d] text-white px-6 py-3 rounded-lg font-semibold transition">
                        Enviar solicitação
                    </button>

                    <button type="button"
                        onclick="closeAssociationModal()"
                        class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-6 py-3 rounded-lg font-semibold transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
