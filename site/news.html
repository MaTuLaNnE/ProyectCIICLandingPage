<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Noticias CIIC</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/favicon/favicon.ico" type="image/x-icon">

  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/news.js"></script>


  <!-- Tailwind y extras -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <link rel="icon" href="images/favicon/favicon.ico" type="image/x-icon">

  <style>
    html {
      scroll-behavior: smooth;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .hero-bg {
      background: linear-gradient(rgba(0, 35, 102, 0.72), rgba(0, 35, 102, 0.72)), url('images/pagina/fondoNoticias.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>

<body class="font-sans bg-gray-50 text-gray-800">
      <!-- Header -->
    <div id="navbar-container"></div>
    <script src="js/navbar.js"></script>
  </header>

  <!-- Hero Section -->
  <section class="hero-bg pt-36 pb-24 md:pt-44 md:pb-32 text-white relative overflow-hidden">
    <div class="container mx-auto px-4">
      <div class="max-w-4xl">
        <h1 class="text-4xl md:text-6xl font-extrabold leading-tight mb-6" data-aos="fade-up">Noticias e Oportunidades</h1>
        <p class="text-lg md:text-2xl text-blue-50 max-w-3xl leading-relaxed mb-8" data-aos="fade-up"
          data-aos-delay="100">Conecte-se com oportunidades de negocio por meio dos nossos eventos internacionais</p>
        <div class="flex flex-col sm:flex-row gap-4" data-aos="fade-up" data-aos-delay="200">
          <a href="#" onClick="openContactModal()"
            class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold px-8 py-4 rounded-xl transition shadow-lg text-center">Contactar</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Stats Section -->
  <section class="py-12 bg-white">
    <div class="container mx-auto px-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
        <div data-aos="fade-up" data-aos-delay="100">
          <h3 class="text-4xl font-bold text-blue-800">25+</h3>
          <p class="text-gray-600 mt-2">Eventos realizados</p>
        </div>
        <div data-aos="fade-up" data-aos-delay="200">
          <h3 class="text-4xl font-bold text-blue-800">500+</h3>
          <p class="text-gray-600 mt-2">Participantes conectados</p>
        </div>
        <div data-aos="fade-up" data-aos-delay="300">
          <h3 class="text-4xl font-bold text-blue-800">13</h3>
          <p class="text-gray-600 mt-2">Países participantes</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Noticias Section -->
  <section id="news" class="py-16 bg-gray-100">
    <div class="container mx-auto px-4">
      <h2 class="text-3xl font-bold text-center mb-12" data-aos="fade-up">Próximas Oportunidades</h2>

      <div id="news-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- carga de noticias -->

      </div>
    </div>
  </section>

  <!-- CTA Section
  <section id="contact" class="py-20 bg-blue-800 text-white">
    <div class="container mx-auto px-4 text-center" data-aos="fade-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-6">¿Listo para Participar?</h2>
      <p class="text-xl mb-8 max-w-2xl mx-auto">Únete a nuestros eventos y conecta con empresarios de toda
        Latinoamérica. Descubre nuevas oportunidades de negocio.</p>
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="#" class="bg-white text-blue-800 hover:bg-gray-100 px-6 py-3 rounded-lg font-medium">Registrarse</a>
        <a href="#"
          class="bg-transparent border-2 border-white hover:bg-white hover:text-blue-800 px-6 py-3 rounded-lg font-medium">Más
          Información</a>
      </div>
    </div>
  </section> -->

  <!-- Footer -->

  <div id="footer"></div>

  <script>
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
        feather.replace();
      });
  </script>

  <!-- Contact Floating Button -->
  <button onclick="openContactModal()" id="contactFloatBtn"
    class="fixed bottom-8 right-24 bg-green-600 hover:bg-green-700 text-white p-3 rounded-full shadow-lg z-[9998] transition-all duration-300">
    <i data-feather="message-circle"></i>
  </button>

  <!-- Back to Top Button -->
  <button onclick="topFunction()" id="backToTop"
    class="fixed bottom-8 right-8 bg-blue-600 text-white p-3 rounded-full shadow-lg hidden">
    <i data-feather="arrow-up"></i>
  </button>

  <script>
    // Initialize animations and icons
    AOS.init();
    feather.replace();

    // Mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', function () {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    });

    // Mobile countries menu toggle
    document.getElementById('mobile-countries-button').addEventListener('click', function () {
      const menu = document.getElementById('mobile-countries-menu');
      menu.classList.toggle('hidden');
      const icon = this.querySelector('i');
      if (menu.classList.contains('hidden')) {
        feather.replace();
      } else {
        icon.setAttribute('data-feather', 'chevron-up');
        feather.replace();
      }
    });

    function openContactModal() {
      const modal = document.getElementById('contactModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      feather.replace();
    }

    function closeContactModal() {
      const modal = document.getElementById('contactModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

  </script>




  <!-- Contact Modal -->

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="js/contact-form.js"></script>

  <div id="contactModal" onclick="if(event.target === this) closeContactModal()"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] px-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-8 relative animate-fadeIn">

      <!-- Botón cerrar -->
      <button type="button" onclick="closeContactModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-700">
        <i data-feather="x" class="w-5 h-5"></i>
      </button>

      <!-- Título -->
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Entre em Contato</h2>
        <p class="text-gray-500 mt-1">
          Preencha os dados abaixo e envie sua solicitude.
        </p>
      </div>

      <!-- Formulario -->
      <form class="contact-form space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
          <input type="text" name="name" placeholder="Seu nome" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">País</label>
          <input type="text" name="country" placeholder="Seu país" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" name="email" placeholder="seuemail@exemplo.com" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Assunto</label>
          <select name="subject" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="" disabled selected>Selecione um assunto</option>
            <option value="Atendimento legal internacional">Atendimento legal internacional</option>
            <option value="Arbitragem e mediação">Arbitragem e mediação</option>
            <option value="Solução para empresas com dívida fiscal">Solução para empresas com dívida fiscal
            </option>
            <option value="Cursos e capacitação">Cursos e capacitação</option>
            <option value="Parcerias institucionais">Parcerias institucionais</option>
            <option value="Comércio internacional">Comércio internacional</option>
            <option value="Representação empresarial">Representação empresarial</option>
            <option value="Consultoria empresarial">Consultoria empresarial</option>
            <option value="Eventos e missões comerciais">Eventos e missões comerciais</option>
            <option value="Portal de notícias">Portal de notícias</option>
            <option value="Associação / filiação">Associação / filiação</option>
            <option value="Suporte técnico">Suporte técnico</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Solicitude</label>
          <textarea rows="5" name="message" placeholder="Escreva sua mensagem..." required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </div>

        <div class="hidden text-sm rounded-lg px-4 py-3" data-form-status></div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeContactModal()"
            class="px-5 py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">
            Cancelar
          </button>

          <button type="submit" class="px-5 py-3 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
            Enviar
          </button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
